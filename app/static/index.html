<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT 字幕时间校准</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 1080px; margin: 0 auto; padding: 24px; color: #222; background: #f6f7f9; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 160px; font-family: ui-monospace, Consolas, monospace;
             font-size: 13px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
  input[type=text] { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
             padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; width: 150px; }
  button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
           background: #2563eb; color: #fff; font-size: 14px; }
  button.secondary { background: #e5e7eb; color: #222; }
  button.danger { background: #fee2e2; color: #b91c1c; padding: 4px 10px; font-size: 13px; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .anchor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .anchor-row.to-drop { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;
             padding: 6px 8px; margin-left: -8px; margin-right: -8px; }
  .anchor-row.to-drop input { text-decoration: line-through; border-color: #fca5a5; color: #b91c1c; }
  .drop-tag { color: #b91c1c; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .suggest-panel { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
             padding: 12px 16px; margin: 12px 0; }
  .suggest-panel h2 { margin-top: 4px; }
  .hint { color: #6b7280; font-size: 13px; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
           padding: 10px 14px; border-radius: 6px; margin: 12px 0; white-space: pre-wrap; }
  .ok-banner { background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857;
           padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
  .bad-banner { background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c;
           padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  tr.problem { background: #fef2f2; }
  .flag { display: inline-block; background: #fee2e2; color: #b91c1c; border-radius: 4px;
          padding: 1px 6px; font-size: 12px; margin-right: 4px; }
  .mono { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>SRT 字幕时间校准</h1>
<p class="hint">粘贴或上传 SRT，设置至少 2 个「原字幕时刻 → 视频实际时刻」锚点。
相邻锚点间线性插值，两端按最近一段斜率外推。存在负时间、起止倒置或与下一条重叠时禁止导出。
锚点校验失败时会自动给出异常定位建议（最少剔除方案），确认前不会改动你的输入。</p>

<div class="card">
  <h2>1. 字幕内容</h2>
  <input type="file" id="file" accept=".srt,.txt">
  <textarea id="srt" placeholder="1&#10;00:00:01,000 --> 00:00:03,000&#10;第一句字幕&#10;&#10;2&#10;00:00:04,000 --> 00:00:06,000&#10;第二句字幕"></textarea>
</div>

<div class="card">
  <h2>2. 校准锚点（至少 2 个，格式 HH:MM:SS,mmm）</h2>
  <div id="anchors"></div>
  <button class="secondary" onclick="addAnchor()">+ 添加锚点</button>
</div>

<div class="card">
  <h2>3. 预览与导出</h2>
  <div class="toolbar">
    <button onclick="preview()">预览校准结果</button>
    <button id="exportBtn" onclick="exportSrt()" disabled>导出校准后 SRT</button>
    <span class="hint" id="exportHint">请先预览，且无问题字幕时才能导出</span>
  </div>
  <div id="message"></div>
  <div id="suggest"></div>
  <div id="result"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/</g, "&lt;");

// 文件上传 -> 读入 textarea
$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { $("srt").value = r.result; clearSuggest(); };
  r.readAsText(f);
});
$("srt").addEventListener("input", clearSuggest);
// 锚点输入一旦变化，之前的建议即失效
$("anchors").addEventListener("input", clearSuggest);

function addAnchor(orig = "", actual = "") {
  const div = document.createElement("div");
  div.className = "anchor-row";
  div.innerHTML =
    `<span class="hint">原时刻</span><input type="text" class="orig" placeholder="00:01:00,000" value="${orig}">` +
    `<span class="hint">→ 实际时刻</span><input type="text" class="actual" placeholder="00:01:02,500" value="${actual}">` +
    `<button class="danger" onclick="removeAnchor(this)">删除</button>`;
  $("anchors").appendChild(div);
  clearSuggest();
}
addAnchor(); addAnchor();

function removeAnchor(btn) {
  btn.parentElement.remove();
  clearSuggest();
}

function collectAnchors() {
  return [...document.querySelectorAll("#anchors .anchor-row")].map(row => ({
    orig: row.querySelector(".orig").value.trim(),
    actual: row.querySelector(".actual").value.trim(),
  })).filter(a => a.orig || a.actual);
}

function payload() {
  return JSON.stringify({ srt: $("srt").value, anchors: collectAnchors() });
}

function showError(msg) {
  $("message").innerHTML = `<div class="error">⚠ ${esc(msg)}</div>`;
  $("result").innerHTML = "";
  $("exportBtn").disabled = true;
}

function renderTable(data) {
  const rows = data.entries.map(e => `
    <tr class="${e.flags.length ? "problem" : ""}">
      <td>${esc(e.index)}</td>
      <td class="mono">${e.old}</td>
      <td class="mono">${e.new}</td>
      <td>${e.flags.map(f => `<span class="flag">${f}</span>`).join("")}</td>
      <td class="mono">${esc(e.text)}</td>
    </tr>`).join("");
  return `<table>
    <tr><th>#</th><th>原时间</th><th>校准后时间</th><th>问题</th><th>正文</th></tr>${rows}</table>`;
}

// 在锚点输入区标出建议剔除的行（仅视觉标记，不改动输入值）
function markDropLines(lines) {
  const set = new Set(lines);
  let n = 0;
  document.querySelectorAll("#anchors .anchor-row").forEach(row => {
    const orig = row.querySelector(".orig").value.trim();
    const actual = row.querySelector(".actual").value.trim();
    if (!orig && !actual) return;  // 与 collectAnchors 的过滤规则一致
    n++;
    if (set.has(n)) {
      row.classList.add("to-drop");
      const tag = document.createElement("span");
      tag.className = "drop-tag";
      tag.textContent = "✗ 待剔除";
      row.appendChild(tag);
    }
  });
}

function clearSuggest() {
  document.querySelectorAll("#anchors .anchor-row.to-drop").forEach(row => {
    row.classList.remove("to-drop");
    const tag = row.querySelector(".drop-tag");
    if (tag) tag.remove();
  });
  $("suggest").innerHTML = "";
}

// 确认建议：移除待剔除行，然后按原流程重新预览（之后可正常导出）
function confirmDrops() {
  document.querySelectorAll("#anchors .anchor-row.to-drop").forEach(r => r.remove());
  clearSuggest();
  preview();
}

async function fetchSuggest() {
  let res;
  try {
    res = await fetch("/api/suggest", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: payload(),
    });
  } catch (e) { return; }  // 网络错误时只保留原错误提示
  const data = await res.json();
  if (!res.ok) return;     // 无法定位（如时间格式错误），只显示原错误
  if (!data.possible) {
    $("suggest").innerHTML = `<div class="bad-banner">✗ 无法预演：${data.message}</div>`;
    return;
  }
  markDropLines(data.drop_lines);
  const kept = data.kept_anchors
    .map(a => `第 ${a.line} 行（${a.orig} → ${a.actual}）`).join("、");
  const previewHtml = data.preview
    ? `<p class="hint">以下为仅使用保留锚点的校准预览（受影响字幕），确认前输入不会被改动：</p>
       ${renderTable(data.preview)}`
    : `<p class="hint">字幕内容暂无法解析（${esc(data.srt_error || "未知原因")}），故不显示预演；剔除建议不受影响。</p>`;
  $("suggest").innerHTML = `
    <div class="suggest-panel">
      <h2>锚点异常定位建议</h2>
      <p>${data.message}</p>
      <p class="hint">待剔除行已在上方标红；保留锚点：${kept || "（无）"}</p>
      <div class="toolbar">
        <button onclick="confirmDrops()">确认剔除并重新预览</button>
        <button class="secondary" onclick="clearSuggest()">取消（不改动输入）</button>
      </div>
      ${previewHtml}
    </div>`;
}

async function preview() {
  clearSuggest();
  $("message").innerHTML = "";
  let res;
  try {
    res = await fetch("/api/preview", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: payload(),
    });
  } catch (e) { return showError("网络错误：" + e); }
  const data = await res.json();
  if (!res.ok) {
    showError(data.detail || "请求失败");
    return fetchSuggest();  // 校验失败时自动给出异常定位建议
  }

  $("result").innerHTML = renderTable(data);

  if (data.ok) {
    $("message").innerHTML = `<div class="ok-banner">✓ 共 ${data.entries.length} 条，全部正常，可以导出。</div>`;
    $("exportBtn").disabled = false;
  } else {
    $("message").innerHTML = `<div class="bad-banner">✗ 发现 ${data.problem_count} 条问题字幕（负时间 / 起止倒置 / 与下一条重叠），已禁止导出。</div>`;
    $("exportBtn").disabled = true;
  }
}

async function exportSrt() {
  let res;
  try {
    res = await fetch("/api/export", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: payload(),
    });
  } catch (e) { return showError("网络错误：" + e); }
  if (!res.ok) {
    const data = await res.json();
    return showError(data.detail || "导出被拒绝");
  }
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "calibrated.srt";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
